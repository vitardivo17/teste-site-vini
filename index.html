<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meu primeiro site</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; padding: 24px;
      display: grid; place-items: center;
      background: #f5f4f1; color: #1b1b1b;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(100%, 450px); background: #fff; padding: 48px 36px;
      border: 1px solid #e9e8e3; border-radius: 24px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, .06); text-align: center;
    }
    .emoji { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: clamp(32px, 8vw, 44px); letter-spacing: -1.8px; margin: 8px 0; }
    p { color: #646464; line-height: 1.6; margin: 0 0 28px; }
    button {
      border: 0; border-radius: 12px; background: #181818; color: #fff;
      padding: 14px 20px; font: inherit; font-weight: 600; cursor: pointer;
      transition: transform .15s, background .15s;
    }
    button:hover { background: #333; transform: translateY(-2px); }
    #mensagem { min-height: 24px; margin: 18px 0 0; font-weight: 600; color: #13834b; }
  </style>
</head>
<body>
  <main class="card">
    <div class="emoji" aria-hidden="true">👋</div>
    <h1>Hello, World!</h1>
    <p>Meu primeiro site criado com o ChatGPT e publicado com GitHub Pages.</p>
    <button id="botao" type="button">Clique para testar</button>
    <div id="mensagem" role="status" aria-live="polite"></div>
  </main>
  <script>
    document.getElementById('botao').addEventListener('click', () => {
      document.getElementById('mensagem').textContent = 'Funcionou! 🚀';
    });
  </script>
</body>
</html>
